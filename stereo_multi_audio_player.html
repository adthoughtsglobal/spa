<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mixtraxer Pro</title>
<style>
  :root { --bg:#0a0a0c; --panel:#141417; --accent:#00ff88; --text:#e0e0e0; --danger:#ff4444; }
  * { box-sizing: border-box; }
  body { font-family:'Segoe UI',system-ui,sans-serif; background:var(--bg); color:var(--text); margin:0;
         display:flex; flex-direction:column; min-height:100dvh; -webkit-tap-highlight-color:transparent; }
  button, input { touch-action: manipulation; }

  header { background:var(--panel); padding:1rem; border-bottom:1px solid #222; display:flex;
           flex-wrap:wrap; justify-content:space-between; align-items:center; gap:1rem; }
  .master-group { display:flex; flex-wrap:wrap; align-items:center; gap:.75rem; }
  .master-btn { background:var(--accent); color:#000; font-weight:bold; border:none; padding:.8rem 1.2rem;
                border-radius:2rem; cursor:pointer; font-size:.9rem; min-height:44px; }
  .master-btn:active { transform:scale(.95); }
  .master-btn.secondary { background:#333; color:#fff; }

  main { display:flex; flex-direction:column; flex:1; gap:1px; background:#222; }
  .channel-sec { flex:1; background:var(--bg); display:flex; flex-direction:column; padding:1rem; min-width:0; }
  h2 { margin:0 0 .8rem; font-size:1.1rem; text-transform:uppercase; letter-spacing:2px; color:var(--accent);
       display:flex; justify-content:space-between; }
  .control-box { background:var(--panel); padding:1rem; border-radius:1rem; margin-bottom:1rem; }
  .transport { display:flex; gap:.5rem; margin-bottom:1rem; }
  .transport button { background:#222; border:1px solid #333; color:#fff; padding:.7rem; border-radius:.5rem;
                      cursor:pointer; flex:1; min-height:44px; font-size:1rem; }
  .transport button:active { background:#333; }
  input[type=file] { font-size:.85rem; width:100%; margin-bottom:1rem; }
  .slider-label-group { display:flex; justify-content:space-between; margin:.8rem 0 .3rem; }
  label { font-size:.7rem; color:#888; text-transform:uppercase; letter-spacing:1px; }
  .time-display { font-family:monospace; font-size:.75rem; color:var(--accent); }
  input[type=range] { width:100%; accent-color:var(--accent); cursor:pointer; height:28px; }
  canvas { width:100%; height:80px; background:#000; border-radius:.5rem; margin-bottom:1rem; display:block; }
  .marquee-container { background:#000; padding:.5rem; border-radius:.3rem; margin-bottom:1rem; overflow:hidden; }
  .marquee { white-space:nowrap; display:inline-block; animation:scroll 10s linear infinite; color:var(--accent); font-family:monospace; }
  @keyframes scroll { 0% { transform:translateX(100%); } 100% { transform:translateX(-100%); } }
  .tracklist { flex:1; min-height:120px; background:var(--panel); border-radius:.5rem; overflow-y:auto; font-size:.9rem; }
  .trackitem { display:flex; align-items:center; padding:.7rem .6rem; border-bottom:1px solid #222; gap:.5rem; }
  .trackitem span { flex:1; cursor:pointer; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .trackitem button { background:none; border:none; color:#888; cursor:pointer; padding:6px 10px; font-size:1rem; }
  .settings-row { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; }

  /* Desktop / wide layout: two columns, fixed-height app */
  @media (min-width: 900px) {
    body { height:100dvh; overflow:hidden; }
    header { padding:1.5rem 2rem; }
    main { flex-direction:row; overflow:hidden; }
    .channel-sec { padding:1.5rem; overflow-y:auto; }
  }
</style>
</head>
<body>

<header>
  <h1 style="margin:0;font-size:1.5rem;">MIXTRAXER <span style="font-weight:300;opacity:.5;">PRO</span></h1>
  <div class="master-group">
    <button class="master-btn" id="playBoth">▶ PLAY BOTH</button>
    <button class="master-btn secondary" id="pauseBoth">⏸ PAUSE BOTH</button>
    <div class="settings-row">
      <button class="master-btn secondary" id="toggleSync">Auto Sync: ON</button>
      <button class="master-btn secondary" id="toggleOrbit">360 Mode: OFF</button>
      <label>Speed <input id="speed" type="range" min="0" max="5" step="0.1" value="1" style="width:90px;"></label>
    </div>
  </div>
</header>

<main>
  <section class="channel-sec">
    <h2>LEFT EAR <span>L</span></h2>
    <div class="control-box">
      <input id="leftFiles" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple>
      <div class="transport">
        <button id="prevLeft">⏮</button><button id="playLeft">▶</button>
        <button id="pauseLeft">⏸</button><button id="nextLeft">⏭</button>
      </div>
      <div class="slider-label-group"><label>SEEK</label><span id="leftTime" class="time-display">0:00 / 0:00</span></div>
      <input id="leftSeek" type="range" min="0" max="100" step="0.1" value="0">
      <div class="slider-label-group"><label>VOLUME</label></div>
      <input id="leftVol" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>
    <canvas id="leftWave"></canvas>
    <div class="marquee-container"><div id="leftNow" class="marquee">No track loaded...</div></div>
    <div id="leftList" class="tracklist"></div>
  </section>

  <section class="channel-sec">
    <h2>RIGHT EAR <span>R</span></h2>
    <div class="control-box">
      <input id="rightFiles" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.flac,.ogg,.opus" multiple>
      <div class="transport">
        <button id="prevRight">⏮</button><button id="playRight">▶</button>
        <button id="pauseRight">⏸</button><button id="nextRight">⏭</button>
      </div>
      <div class="slider-label-group"><label>SEEK</label><span id="rightTime" class="time-display">0:00 / 0:00</span></div>
      <input id="rightSeek" type="range" min="0" max="100" step="0.1" value="0">
      <div class="slider-label-group"><label>VOLUME</label></div>
      <input id="rightVol" type="range" min="0" max="1" step="0.01" value="0.8">
    </div>
    <canvas id="rightWave"></canvas>
    <div class="marquee-container"><div id="rightNow" class="marquee">No track loaded...</div></div>
    <div id="rightList" class="tracklist"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let ac, merger, t = 0, rotate360 = false, autoSync = true, orbitRun = false, vizRun = false;

function mkChannel(p) {
  return { files: [], idx: 0, loaded: null, url: null, analyzed: null, analyzing: false, bpm: 0, beats: [],
           drag: false, name: '', canvas: $(p + 'Wave'), now: $(p + 'Now'), seek: $(p + 'Seek'),
           time: $(p + 'Time'), vol: $(p + 'Vol'), list: $(p + 'List'), input: $(p + 'Files') };
}
const L = mkChannel('left'), R = mkChannel('right'), chans = [L, R];

function fmt(s) { s = Math.max(0, s || 0); return `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`; }

/* ---------- Audio graph ---------- */
function build() {
  merger = ac.createChannelMerger(2);
  chans.forEach(c => {
    c.elem = new Audio();
    c.elem.preload = 'auto';
    c.srcNode = ac.createMediaElementSource(c.elem);
    c.an = ac.createAnalyser(); c.an.fftSize = 256;
    c.gain = ac.createGain(); c.gain.gain.value = parseFloat(c.vol.value);
    c.data = new Uint8Array(c.an.frequencyBinCount);
    c.elem.ontimeupdate = () => {
      const d = c.elem.duration;
      if (!isFinite(d) || d <= 0) return;
      if (!c.drag) c.seek.value = (c.elem.currentTime / d) * 100;
      c.time.textContent = `${fmt(c.elem.currentTime)} / ${fmt(d)}`;
    };
    c.elem.onended = () => step(c, 1);
  });
  connectStereo();
}

function disconnectAll() {
  chans.forEach(c => [c.srcNode, c.an, c.gain, c.panner].forEach(n => { try { n && n.disconnect(); } catch (e) {} }));
  try { merger.disconnect(); } catch (e) {}
}
function connectStereo() {
  disconnectAll();
  chans.forEach((c, i) => { c.srcNode.connect(c.an); c.an.connect(c.gain); c.gain.connect(merger, 0, i); });
  merger.connect(ac.destination);
}
function connectOrbit() {
  disconnectAll();
  chans.forEach(c => {
    if (!c.panner) { c.panner = ac.createPanner(); c.panner.panningModel = 'HRTF'; c.panner.distanceModel = 'inverse'; }
    c.srcNode.connect(c.an); c.an.connect(c.panner); c.panner.connect(c.gain); c.gain.connect(ac.destination);
  });
}

async function ensureCtx() {
  if (!ac) { ac = new (window.AudioContext || window.webkitAudioContext)(); build(); }
  if (ac.state !== 'running') { try { await ac.resume(); } catch (e) {} }
}

/* ---------- BPM ---------- */
function detectBPM(buf) {
  const data = buf.getChannelData(0), sr = buf.sampleRate;
  const win = Math.floor(sr * 0.05), hop = Math.floor(win / 2), en = [];
  for (let i = 0; i < data.length - win; i += hop) {
    let e = 0; for (let j = 0; j < win; j++) e += data[i + j] * data[i + j]; en.push(e);
  }
  if (en.length < 3) return { bpm: 120, beats: [] };
  const thr = en.reduce((a, b) => a + b) / en.length * 1.5, beats = [];
  for (let i = 1; i < en.length - 1; i++)
    if (en[i] > thr && en[i] > en[i - 1] && en[i] > en[i + 1]) beats.push((i * hop) / sr);
  if (beats.length < 2) return { bpm: 120, beats: [] };
  const iv = []; for (let i = 1; i < Math.min(beats.length, 50); i++) iv.push(beats[i] - beats[i - 1]);
  const bpm = Math.round(60 / (iv.reduce((a, b) => a + b) / iv.length));
  return { bpm: bpm > 60 && bpm < 200 ? bpm : 120, beats };
}

async function analyze(c) {
  const f = c.files[c.idx];
  if (!f || c.analyzing || c.analyzed === f) return;
  c.analyzing = true;
  setNow(c, `Analyzing ${f.name}...`, true);
  try {
    const buf = await ac.decodeAudioData(await f.arrayBuffer());
    const r = detectBPM(buf);
    if (c.files[c.idx] === f) { c.bpm = r.bpm; c.beats = r.beats; c.analyzed = f; }
  } catch (e) {
    console.warn('Analysis failed', e);
    c.bpm = 0; c.beats = []; c.analyzed = f;   // don't retry endlessly
  }
  c.analyzing = false;
  setNow(c);
}

function setNow(c, text, raw) {
  const f = c.files[c.idx];
  if (!text && !f) { c.now.textContent = 'No track loaded...'; return; }
  c.now.textContent = raw ? text : `NOW PLAYING: ${f.name}${c.bpm ? ` [${c.bpm} BPM]` : ''}`;
}

/* ---------- Playback ---------- */
async function load(c, start = 0, autoplay = true) {
  const f = c.files[c.idx];
  if (!f) return;
  if (c.url) URL.revokeObjectURL(c.url);
  c.url = URL.createObjectURL(f);
  c.loaded = f;
  await new Promise(res => {
    c.elem.addEventListener('loadedmetadata', res, { once: true });
    c.elem.addEventListener('error', res, { once: true });
    c.elem.src = c.url;
  });
  if (start > 0 && isFinite(c.elem.duration)) c.elem.currentTime = Math.min(start, c.elem.duration - 0.1);
  setNow(c);
  if (autoplay) { try { await c.elem.play(); } catch (e) { console.warn('play blocked', e); } }
}

async function playChannel(c) {
  await ensureCtx();
  if (!c.files.length) return;
  if (c.loaded === c.files[c.idx] && c.elem.src) { try { await c.elem.play(); } catch (e) {} }
  else await load(c);
  startViz();
  analyze(c);               // runs in background so playback starts instantly
}

function select(c, i) { c.idx = i; c.bpm = 0; c.beats = []; c.analyzed = null; }

async function step(c, dir) {
  if (!c.files.length) return;
  await ensureCtx();
  select(c, (c.idx + dir + c.files.length) % c.files.length);
  await load(c);
  startViz();
  analyze(c);
}

/* ---------- Visualizer ---------- */
function startViz() { if (!vizRun) { vizRun = true; requestAnimationFrame(viz); } }
function viz() {
  if (!ac) { vizRun = false; return; }
  chans.forEach(c => {
    const cv = c.canvas, d = window.devicePixelRatio || 1;
    const w = Math.round(cv.clientWidth * d), h = Math.round(cv.clientHeight * d);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const g = cv.getContext('2d');
    c.an.getByteFrequencyData(c.data);
    g.clearRect(0, 0, w, h);
    g.fillStyle = '#00ff88';
    const n = c.data.length, bw = w / n;
    for (let i = 0; i < n; i++) { const bh = (c.data[i] / 255) * h; g.fillRect(i * bw, h - bh, Math.max(1, bw - 1), bh); }
  });
  requestAnimationFrame(viz);
}

function animate() {
  if (!rotate360) { orbitRun = false; return; }
  t += 0.02 * parseFloat($('speed').value);
  const set = (p, a) => { if (p) { p.positionX.value = Math.cos(a); p.positionY.value = 0; p.positionZ.value = Math.sin(a); } };
  set(L.panner, t); set(R.panner, t + Math.PI);
  requestAnimationFrame(animate);
}

/* ---------- Track lists ---------- */
function renderList(c) {
  c.list.innerHTML = '';
  c.files.forEach((f, i) => {
    const row = document.createElement('div'); row.className = 'trackitem';
    const name = document.createElement('span'); name.textContent = `${i + 1}. ${f.name}`;
    name.onclick = async () => { await ensureCtx(); select(c, i); await load(c); startViz(); analyze(c); };
    const rm = document.createElement('button'); rm.textContent = '✕';
    rm.onclick = e => { e.stopPropagation(); c.files.splice(i, 1); if (i < c.idx) c.idx--; renderList(c); };
    row.append(name, rm); c.list.appendChild(row);
  });
}

chans.forEach(c => {
  c.input.onchange = () => { c.files = Array.from(c.input.files); select(c, 0); c.loaded = null; renderList(c); setNow(c); c.input.value = ''; };
  c.seek.addEventListener('input', () => {
    c.drag = true;
    if (c.elem && isFinite(c.elem.duration)) c.elem.currentTime = (c.seek.value / 100) * c.elem.duration;
  });
  c.seek.addEventListener('change', () => { c.drag = false; });
  c.vol.oninput = () => { if (c.gain) c.gain.gain.value = parseFloat(c.vol.value); };
});

/* ---------- Buttons ---------- */
$('playLeft').onclick = () => playChannel(L);
$('playRight').onclick = () => playChannel(R);
$('pauseLeft').onclick = () => L.elem && L.elem.pause();
$('pauseRight').onclick = () => R.elem && R.elem.pause();
$('prevLeft').onclick = () => step(L, -1);
$('nextLeft').onclick = () => step(L, 1);
$('prevRight').onclick = () => step(R, -1);
$('nextRight').onclick = () => step(R, 1);

$('playBoth').onclick = async () => {
  await ensureCtx();
  if (!L.files.length || !R.files.length) return;
  let offL = 0, offR = 0;
  if (autoSync) {
    for (const c of chans) if (c.analyzed !== c.files[c.idx]) await analyze(c);
    if (L.beats.length && R.beats.length) {
      const d = L.beats[0] - R.beats[0];
      if (d > 0) offL = d; else offR = -d;   // skip into the track whose first beat comes later
    }
  }
  await Promise.all([load(L, offL, false), load(R, offR, false)]);
  L.elem.play().catch(() => {}); R.elem.play().catch(() => {});
  startViz();
};
$('pauseBoth').onclick = () => chans.forEach(c => c.elem && c.elem.pause());

$('toggleSync').onclick = () => {
  autoSync = !autoSync;
  $('toggleSync').textContent = `Auto Sync: ${autoSync ? 'ON' : 'OFF'}`;
  $('toggleSync').style.background = autoSync ? '#333' : 'var(--danger)';
};

$('toggleOrbit').onclick = async () => {
  await ensureCtx();
  rotate360 = !rotate360;
  const b = $('toggleOrbit');
  b.textContent = `360 Mode: ${rotate360 ? 'ON' : 'OFF'}`;
  b.style.background = rotate360 ? 'var(--accent)' : '#333';
  b.style.color = rotate360 ? 'black' : 'white';
  if (rotate360) { connectOrbit(); if (!orbitRun) { orbitRun = true; animate(); } }
  else connectStereo();
};
</script>
</body>
</html>
