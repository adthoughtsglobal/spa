<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keep Face Visible</title>
    <script src="./resources/face.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: sans-serif
        }

        canvas {
            border: 2px solid #ffffffab;
            background: #111;
            max-width: 90vw
        }

        #status {
            position: fixed;
            top: 10px;
            background: rgba(0, 0, 0, .8);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            border: 1px solid #333
        }

        button {
            margin-top: 15px;
            padding: 10px 18px;
            font-size: 14px;
            cursor: pointer
        }

        video {
            display: none
        }
    </style>
</head>

<body>

    <div id="status">Waiting for Camera...</div>
    <canvas id="output"></canvas>
    <button id="snapBtn">Snap OFF</button>
    <video id="video" playsinline muted autoplay></video>

    <script>const video = document.getElementById("video");
        const canvas = document.getElementById("output");
        const ctx = canvas.getContext("2d");
        const status = document.getElementById("status");
        const snapBtn = document.getElementById("snapBtn");

        let W = 640;
        let H = 480;

        canvas.width = W;
        canvas.height = H;

        let currentView = { x: 0, y: 0, w: W, h: H };
        let snapToFace = false;

        const CENTER_THRESHOLD = 0.15;
        const MIN_ZOOM = 0.35;
        const FACE_COVERAGE = 0.45;

        snapBtn.onclick = () => {
            snapToFace = !snapToFace;
            snapBtn.innerText = snapToFace ? "Snap ON" : "Snap OFF";
        };

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: {
                        width: 1280,
                        height: 720
                    }
                });

                video.srcObject = stream;
                await video.play();

                W = video.videoWidth;
                H = video.videoHeight;

                canvas.width = W;
                canvas.height = H;

                currentView = {
                    x: 0,
                    y: 0,
                    w: video.videoWidth,
                    h: video.videoHeight
                };

                status.innerText = "Loading AI Models...";

                const MODEL_URL = "https://justadudewhohacks.github.io/face-api.js/models/";
                await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

                status.innerText = "AI Active";

                render();
            } catch (e) {
                status.innerText = "Error: " + e.message;
            }
        }

        async function render() {
            let target = {
                x: 0,
                y: 0,
                w: video.videoWidth || W,
                h: video.videoHeight || H
            };

            const detection = await faceapi.detectSingleFace(
                video,
                new faceapi.TinyFaceDetectorOptions({
                    inputSize: 224,
                    scoreThreshold: 0.15
                })
            );

            const SNAP_THRESHOLD = 0.20;
            const SNAP_POSITION_THRESHOLD = 0.20;
            const SNAP_ZOOM_THRESHOLD = 0.15;

            if (detection) {
                const box = detection.box;

                let cropH = box.height / FACE_COVERAGE;
                let cropW = cropH * (W / H);

                cropW = Math.max(
                    cropW,
                    video.videoWidth * MIN_ZOOM
                );

                cropH = cropW / (W / H);

                target.x = box.x + box.width / 2 - cropW / 2;
                target.y = box.y + box.height / 2 - cropH / 2;
                target.w = cropW;
                target.h = cropH;

                target.x = Math.max(
                    0,
                    Math.min(target.x, video.videoWidth - target.w)
                );

                target.y = Math.max(
                    0,
                    Math.min(target.y, video.videoHeight - target.h)
                );

                const faceCenterX = box.x + box.width / 2;
                const faceCenterY = box.y + box.height / 2;

                const viewCenterX = currentView.x + currentView.w / 2;
                const viewCenterY = currentView.y + currentView.h / 2;

                const dx = Math.abs(faceCenterX - viewCenterX) / currentView.w;
                const dy = Math.abs(faceCenterY - viewCenterY) / currentView.h;

                const zoomDelta =
                    Math.abs(target.w - currentView.w) / currentView.w;

                if (snapToFace) {

                    const needsRecenter =
                        dx > SNAP_POSITION_THRESHOLD ||
                        dy > SNAP_POSITION_THRESHOLD;

                    const needsRezoom =
                        zoomDelta > SNAP_ZOOM_THRESHOLD;

                    if (needsRecenter) {
                        currentView.x = target.x;
                        currentView.y = target.y;
                    }

                    if (needsRezoom) {
                        currentView.w = target.w;
                        currentView.h = target.h;

                        currentView.x = target.x;
                        currentView.y = target.y;
                    }

                } else {

                    currentView.x += (target.x - currentView.x) * 0.08;
                    currentView.y += (target.y - currentView.y) * 0.08;
                    currentView.w += (target.w - currentView.w) * 0.08;
                    currentView.h += (target.h - currentView.h) * 0.08;

                }

                status.innerText = snapToFace
                    ? "Snap Mode"
                    : "Face Detected";
            }

            const sX = Math.max(
                0,
                Math.min(currentView.x, video.videoWidth - currentView.w)
            );

            const sY = Math.max(
                0,
                Math.min(currentView.y, video.videoHeight - currentView.h)
            );

            const sW = Math.min(
                currentView.w,
                video.videoWidth - sX
            );

            const sH = Math.min(
                currentView.h,
                video.videoHeight - sY
            );

            ctx.clearRect(0, 0, W, H);

            ctx.save();
            ctx.translate(W, 0);
            ctx.scale(-1, 1);

            if (sW > 0 && sH > 0) {
                ctx.drawImage(
                    video,
                    sX,
                    sY,
                    sW,
                    sH,
                    0,
                    0,
                    W,
                    H
                );
            }

            ctx.restore();

            requestAnimationFrame(render);
        }

        start();</script>

</body>

</html>
