<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PNG to ICN Vectorizer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#0f172a;color:#f1f5f9}
canvas{border:1px solid #334155;max-width:100%;height:auto}
.loader{border:3px solid #f3f3f3;border-top:3px solid #3b82f6;border-radius:50%;width:20px;height:20px;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body class="min-h-screen p-4 md:p-8">
<div class="max-w-7xl mx-auto space-y-6">
<header class="flex flex-col md:flex-row md:justify-between md:items-center gap-4 border-b border-slate-700 pb-4">
<div>
<h1 class="text-3xl font-bold text-blue-400">PNG → ICN Vectorizer</h1>
<p class="text-slate-400 text-sm">Worker-threaded contour tracing, background box + painter's layering</p>
</div>
<div>
<input type="file" id="fileInput" accept="image/*" class="hidden">
<button id="uploadBtn" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded-lg font-medium transition">Upload Image</button>
</div>
</header>

<main class="grid grid-cols-1 lg:grid-cols-3 gap-6">
<section class="bg-slate-800 p-6 rounded-xl border border-slate-700 space-y-5 h-fit">
<h2 class="text-lg font-semibold border-b border-slate-700 pb-2">Settings</h2>
<div>
<label class="block text-sm text-slate-400 mb-1">Color Count <span id="colorVal">5</span></label>
<input type="range" id="colorCount" min="2" max="16" value="5" class="w-full">
</div>
<div>
<label class="block text-sm text-slate-400 mb-1">Simplification <span id="simplifyVal">1.0</span></label>
<input type="range" id="simplify" min="0" max="50" value="10" class="w-full">
<div class="flex justify-between text-xs text-slate-500"><span>Sharp</span><span>Balanced</span><span>Smooth</span></div>
</div>
<div>
<label class="block text-sm text-slate-400 mb-1">Minimum Region Size <span id="minRegionVal">8</span> px</label>
<input type="range" id="minRegion" min="1" max="500" value="8" class="w-full">
</div>
<div>
<label class="block text-sm text-slate-400 mb-1">Output Mode</label>
<select id="outputMode" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
<option value="polygons">Filled Polygons</option>
<option value="outlines">Outlines</option>
</select>
</div>
<div>
<label class="block text-sm text-slate-400 mb-1">ICN Scale (picture is centered on 0,0)</label>
<input type="number" id="scaleInput" step="0.01" min="0.001" value="0.1" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-sm">
</div>
<div class="flex flex-wrap items-center gap-3 pt-2 text-sm text-slate-300">
<label class="flex items-center gap-2"><input type="checkbox" id="oneLine" checked> Single-line output</label>
<label class="flex items-center gap-2"><input type="checkbox" id="flipX" checked> Flip X</label>
<label class="flex items-center gap-2"><input type="checkbox" id="flipY" checked> Flip Y</label>
<label class="flex items-center gap-2"><input type="checkbox" id="transparent" checked> Ignore transparent pixels</label>
</div>
<button id="processBtn" disabled class="w-full bg-green-600 hover:bg-green-500 disabled:bg-slate-600 disabled:cursor-not-allowed py-3 rounded-lg font-bold transition flex items-center justify-center gap-2">
<span id="btnText">Trace Shapes</span><span id="btnLoader" class="loader hidden"></span>
</button>
<button id="downloadBtn" disabled class="w-full bg-slate-700 hover:bg-slate-600 disabled:opacity-50 disabled:cursor-not-allowed py-2 rounded-lg font-medium transition">Download ICN</button>
</section>

<section class="lg:col-span-2 space-y-6">
<div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
<div class="flex justify-between mb-3 items-center">
<span class="text-xs font-mono text-slate-400">PREVIEW</span>
<div id="status" class="text-xs text-blue-400 italic">Upload an image</div>
</div>
<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
<div class="text-center space-y-2">
<div class="bg-slate-950 p-3 rounded-lg min-h-40 flex items-center justify-center"><canvas id="sourceCanvas"></canvas></div>
<div class="text-[10px] text-slate-500 uppercase">Original</div>
</div>
<div class="text-center space-y-2">
<div class="bg-slate-950 p-3 rounded-lg min-h-40 flex items-center justify-center"><canvas id="quantizedCanvas"></canvas></div>
<div class="text-[10px] text-slate-500 uppercase">Quantized Map</div>
</div>
</div>
</div>
<div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
<div class="flex justify-between mb-2 items-center">
<span class="text-xs font-mono text-slate-400">ICN COMMANDS</span>
<button id="copyBtn" disabled class="text-xs bg-slate-700 hover:bg-slate-600 disabled:opacity-50 px-3 py-1 rounded transition">Copy Code</button>
</div>
<textarea id="outputCode" readonly class="w-full h-96 bg-slate-950 text-emerald-400 font-mono text-xs p-4 rounded-lg border border-slate-700 outline-none resize-y" placeholder="ICN code will appear here..."></textarea>
</div>
<div id="palettePanel" class="bg-slate-800 p-4 rounded-xl border border-slate-700 hidden">
<div class="text-xs font-mono text-slate-400 mb-3">PALETTE</div>
<div id="palette" class="flex flex-wrap gap-2"></div>
</div>
</section>
</main>
</div>

<script>
/* ---------- Worker core: runs off the main thread, no DOM access ---------- */
function core(){
const DX=[1,0,-1,0],DY=[0,1,0,-1];
const hex=c=>'#'+((1<<24)|(c[0]<<16)|(c[1]<<8)|c[2]).toString(16).slice(1);

// k-means on a subsample, then per-pixel labelling through an 18-bit colour LUT
function quantize(px,w,h,k,ign){
  const N=w*h,labels=new Int8Array(N).fill(-1),S=[];
  const step=Math.max(1,Math.floor(Math.sqrt(N/14000)));
  for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step){
    const i=(y*w+x)*4;
    if(ign&&px[i+3]<8)continue;
    S.push(px[i],px[i+1],px[i+2]);
  }
  const n=S.length/3;
  if(!n)return{labels,centers:[],out:new Uint8ClampedArray(N*4),transparent:N};
  k=Math.min(k,n);
  const C=new Float64Array(k*3);
  for(let c=0;c<k;c++){const j=Math.floor(c*n/k)*3;C[c*3]=S[j];C[c*3+1]=S[j+1];C[c*3+2]=S[j+2];}
  const nearest=(r,g,b)=>{
    let best=0,bd=1e9;
    for(let c=0;c<k;c++){
      const dr=r-C[c*3],dg=g-C[c*3+1],db=b-C[c*3+2],d=dr*dr+dg*dg+db*db;
      if(d<bd){bd=d;best=c;}
    }
    return best;
  };
  for(let pass=0;pass<8;pass++){
    const sum=new Float64Array(k*3),cnt=new Int32Array(k);
    for(let j=0;j<S.length;j+=3){
      const b=nearest(S[j],S[j+1],S[j+2]);
      sum[b*3]+=S[j];sum[b*3+1]+=S[j+1];sum[b*3+2]+=S[j+2];cnt[b]++;
    }
    for(let c=0;c<k;c++)if(cnt[c]){C[c*3]=sum[c*3]/cnt[c];C[c*3+1]=sum[c*3+1]/cnt[c];C[c*3+2]=sum[c*3+2]/cnt[c];}
  }
  for(let i=0;i<C.length;i++)C[i]=Math.round(C[i]);
  const lut=new Int8Array(1<<18).fill(-1),out=new Uint8ClampedArray(N*4);
  let transparent=0;
  for(let p=0;p<N;p++){
    const i=p*4;
    if(ign&&px[i+3]<8){transparent++;continue;}
    const r=px[i],g=px[i+1],b=px[i+2],key=((r>>2)<<12)|((g>>2)<<6)|(b>>2);
    let l=lut[key];
    if(l<0){l=nearest(r,g,b);lut[key]=l;}
    labels[p]=l;out[i]=C[l*3];out[i+1]=C[l*3+1];out[i+2]=C[l*3+2];out[i+3]=255;
  }
  const centers=[];
  for(let c=0;c<k;c++)centers.push([C[c*3],C[c*3+1],C[c*3+2]]);
  return{labels,centers,out,transparent};
}

// one pass flood fill labels every region of every colour
function components(labels,w,h,minSize){
  const N=w*h,comp=new Int32Array(N),stack=new Int32Array(N),list=[];
  let id=0;
  for(let s=0;s<N;s++){
    if(comp[s]||labels[s]<0)continue;
    const lab=labels[s];
    id++;comp[s]=id;
    let sp=0,size=0,border=false;
    stack[sp++]=s;
    while(sp){
      const p=stack[--sp],x=p%w,y=(p-x)/w;
      size++;
      if(x===0||y===0||x===w-1||y===h-1)border=true;
      if(x>0&&!comp[p-1]&&labels[p-1]===lab){comp[p-1]=id;stack[sp++]=p-1;}
      if(x<w-1&&!comp[p+1]&&labels[p+1]===lab){comp[p+1]=id;stack[sp++]=p+1;}
      if(y>0&&!comp[p-w]&&labels[p-w]===lab){comp[p-w]=id;stack[sp++]=p-w;}
      if(y<h-1&&!comp[p+w]&&labels[p+w]===lab){comp[p+w]=id;stack[sp++]=p+w;}
    }
    if(size>=minSize)list.push({id,lab,border,start:s});
  }
  return{comp,list};
}

// exact outer contour by walking pixel edges (4-connected); only corner vertices are emitted
function trace(comp,id,start,w,h){
  const ins=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&comp[y*w+x]===id;
  const sx=start%w,sy=(start/w)|0,pts=[];
  let x=sx,y=sy,d=0,first=true,guard=4*(w+1)*(h+1);
  while(guard-->0){
    if(!first&&x===sx&&y===sy&&d===3){pts.push([x,y]);break;}
    first=false;
    let L,R;
    if(d===0){L=ins(x,y-1);R=ins(x,y);}
    else if(d===1){L=ins(x,y);R=ins(x-1,y);}
    else if(d===2){L=ins(x-1,y);R=ins(x-1,y-1);}
    else{L=ins(x-1,y-1);R=ins(x,y-1);}
    const nd=!R?(d+1)&3:L?(d+3)&3:d;
    if(nd!==d)pts.push([x,y]);
    x+=DX[nd];y+=DY[nd];d=nd;
  }
  return pts;
}

function dp(ch,eps){
  const n=ch.length,keep=new Uint8Array(n),st=[0,n-1];
  keep[0]=keep[n-1]=1;
  while(st.length){
    const b=st.pop(),a=st.pop();
    if(b-a<2)continue;
    const ax=ch[a][0],ay=ch[a][1],dx=ch[b][0]-ax,dy=ch[b][1]-ay,len=Math.hypot(dx,dy);
    let mx=-1,mi=-1;
    for(let i=a+1;i<b;i++){
      const px=ch[i][0]-ax,py=ch[i][1]-ay;
      const dd=len?Math.abs(dy*px-dx*py)/len:Math.hypot(px,py);
      if(dd>mx){mx=dd;mi=i;}
    }
    if(mx>eps){keep[mi]=1;st.push(a,mi,mi,b);}
  }
  return ch.filter((_,i)=>keep[i]);
}

function simplify(pts,eps){
  const n=pts.length;
  if(n<=4)return pts;
  let m=0,md=-1;
  for(let i=1;i<n;i++){
    const d=(pts[i][0]-pts[0][0])**2+(pts[i][1]-pts[0][1])**2;
    if(d>md){md=d;m=i;}
  }
  const A=dp(pts.slice(0,m+1),eps),B=dp(pts.slice(m).concat([pts[0]]),eps);
  const r=A.slice(0,-1).concat(B.slice(0,-1));
  return r.length>=3?r:pts;
}

function signedArea(p){
  let a=0;
  for(let i=0,n=p.length;i<n;i++){const q=p[(i+1)%n];a+=p[i][0]*q[1]-q[0]*p[i][1];}
  return a/2;
}
const cross=(a,b,c)=>(b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]);

// linked-list ear clipping; only reflex vertices are tested against each candidate ear
function triangulate(P){
  const n=P.length;
  if(n<3)return[];
  const pts=signedArea(P)<0?P.slice().reverse():P;
  if(n===3)return[pts];
  const prev=new Int32Array(n),next=new Int32Array(n),refl=new Uint8Array(n),tris=[];
  for(let i=0;i<n;i++){prev[i]=(i+n-1)%n;next[i]=(i+1)%n;}
  const setR=i=>{refl[i]=cross(pts[prev[i]],pts[i],pts[next[i]])<=0?1:0;};
  for(let i=0;i<n;i++)setR(i);
  const inTri=(p,a,b,c)=>{
    const s=cross(a,b,p),t=cross(b,c,p),u=cross(c,a,p);
    return s>=0&&t>=0&&u>=0;
  };
  let left=n,i=0,fails=0;
  while(left>3){
    const p=prev[i],q=next[i];
    let ear=!refl[i];
    if(ear){
      for(let j=next[q];j!==p;j=next[j]){
        if(refl[j]&&inTri(pts[j],pts[p],pts[i],pts[q])){ear=false;break;}
      }
    }
    if(ear||fails>left){
      if(ear)tris.push([pts[p],pts[i],pts[q]]);
      next[p]=q;prev[q]=p;left--;fails=0;
      setR(p);setR(q);i=q;
    }else{fails++;i=q;}
  }
  const a=i,b=next[a],c=next[b];
  tris.push([pts[a],pts[b],pts[c]]);
  return tris;
}

function run(m){
  const{w,h,k,ign,minSize,eps,outline,scale,fx,fy,one}=m;
  const px=new Uint8ClampedArray(m.buf);
  const q=quantize(px,w,h,k,ign);
  const{comp,list}=components(q.labels,w,h,minSize);

  // most common colour becomes a backdrop box (filled mode, fully opaque images only)
  let bg=-1;
  if(!outline&&q.centers.length&&!q.transparent){
    const cnt=new Array(q.centers.length).fill(0);
    for(let p=0;p<q.labels.length;p++)cnt[q.labels[p]]++;
    bg=cnt.indexOf(Math.max(...cnt));
  }

  const items=[];
  for(const c of list){
    if(c.lab===bg&&c.border)continue;
    let pts=trace(comp,c.id,c.start,w,h);
    if(pts.length<3)continue;
    pts=simplify(pts,eps);
    if(pts.length<3)continue;
    const area=Math.abs(signedArea(pts));
    if(area>=1)items.push({lab:c.lab,pts,area});
  }
  items.sort((a,b)=>b.area-a.area); // painter's algorithm: big first, small on top

  const hw=w/2,hh=h/2;
  const tx=p=>[Math.round(fx?hw-p[0]:p[0]-hw),Math.round(fy?hh-p[1]:p[1]-hh)];
  const out=['scale '+scale];
  let shapes=0,cur=-2;
  if(bg>=0){
    const X=Math.round(hw),Y=Math.round(hh);
    out.push('c '+hex(q.centers[bg]));cur=bg;
    out.push('tri '+(-X)+' '+(-Y)+' '+X+' '+(-Y)+' '+X+' '+Y);
    out.push('tri '+(-X)+' '+(-Y)+' '+X+' '+Y+' '+(-X)+' '+Y);
    shapes+=2;
  }
  if(outline)out.push('w '+Math.max(1,Math.round(1/scale)));
  for(const it of items){
    if(it.lab!==cur){out.push('c '+hex(q.centers[it.lab]));cur=it.lab;}
    if(outline){
      const p=it.pts.map(tx);
      out.push('line '+p[0][0]+' '+p[0][1]+' '+p[1][0]+' '+p[1][1]);
      for(let i=2;i<p.length;i++)out.push('cont '+p[i][0]+' '+p[i][1]);
      out.push('cont '+p[0][0]+' '+p[0][1]);
      shapes++;
    }else{
      for(const t of triangulate(it.pts)){
        const a=tx(t[0]),b=tx(t[1]),c=tx(t[2]);
        if(Math.abs(cross(a,b,c))<0.5)continue;
        out.push('tri '+a[0]+' '+a[1]+' '+b[0]+' '+b[1]+' '+c[0]+' '+c[1]);
        shapes++;
      }
    }
  }
  return{id:m.id,text:out.join(one?' ':'\n'),shapes,centers:q.centers,qbuf:q.out.buffer};
}

self.onmessage=e=>{
  try{const r=run(e.data);postMessage(r,[r.qbuf]);}
  catch(err){postMessage({id:e.data.id,error:String(err&&err.message||err)});}
};
}

/* ---------- Main thread: UI only ---------- */
const $=id=>document.getElementById(id);
const els=Object.fromEntries(['fileInput','uploadBtn','processBtn','downloadBtn','copyBtn','colorCount','colorVal','simplify','simplifyVal','minRegion','minRegionVal','outputMode','flipX','flipY','transparent','sourceCanvas','quantizedCanvas','outputCode','status','btnText','btnLoader','palettePanel','palette','scaleInput','oneLine'].map(i=>[i,$(i)]));
let sourceImage=null,resultText='',fileName='vectorized.icn',worker=null,job=0;

const hex=c=>'#'+((1<<24)|(c[0]<<16)|(c[1]<<8)|c[2]).toString(16).slice(1);
function setStatus(t,k){
  els.status.textContent=t;
  els.status.className='text-xs italic '+(k==='error'?'text-red-400':k==='ok'?'text-green-400':'text-blue-400');
}
function getWorker(){
  if(!worker)worker=new Worker(URL.createObjectURL(new Blob(['('+core+')()'],{type:'text/javascript'})));
  return worker;
}
function busy(b){
  els.processBtn.disabled=b;
  els.btnLoader.classList.toggle('hidden',!b);
  els.btnText.textContent=b?'Tracing...':'Trace Shapes';
}

function loadFile(file){
  if(!file||!file.type.startsWith('image/'))return setStatus('Please choose an image file','error');
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{
    URL.revokeObjectURL(url);
    sourceImage=img;
    const s=Math.min(1,900/Math.max(img.naturalWidth,img.naturalHeight));
    const w=Math.max(1,Math.round(img.naturalWidth*s)),h=Math.max(1,Math.round(img.naturalHeight*s));
    for(const c of [els.sourceCanvas,els.quantizedCanvas]){c.width=w;c.height=h;}
    const ctx=els.sourceCanvas.getContext('2d');
    ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
    els.processBtn.disabled=false;
    setStatus('Image loaded','ok');
  };
  img.onerror=()=>setStatus('Could not decode image','error');
  img.src=url;
}

function processImage(){
  if(!sourceImage)return;
  busy(true);
  const w=els.sourceCanvas.width,h=els.sourceCanvas.height;
  const data=els.sourceCanvas.getContext('2d').getImageData(0,0,w,h).data;
  const id=++job,wk=getWorker();
  wk.onmessage=e=>{
    const r=e.data;
    if(r.id!==id)return;
    busy(false);
    if(r.error)return setStatus('Vectorization failed: '+r.error,'error');
    els.quantizedCanvas.getContext('2d').putImageData(new ImageData(new Uint8ClampedArray(r.qbuf),w,h),0,0);
    resultText=r.text;
    els.outputCode.value=r.text;
    els.copyBtn.disabled=els.downloadBtn.disabled=false;
    els.palette.replaceChildren(...r.centers.map(c=>{
      const d=document.createElement('div');
      d.className='flex items-center gap-2 bg-slate-900 rounded px-2 py-1 text-xs font-mono';
      d.innerHTML='<span class="w-5 h-5 rounded border border-slate-600" style="background:'+hex(c)+'"></span><span>'+hex(c)+' / '+((c[0]<<16)|(c[1]<<8)|c[2])+'</span>';
      return d;
    }));
    els.palettePanel.classList.remove('hidden');
    fileName='vectorized-'+Date.now()+'.icn';
    setStatus(r.shapes+' ICN primitives generated','ok');
  };
  wk.onerror=e=>{busy(false);setStatus('Worker error: '+e.message,'error');};
  wk.postMessage({
    id,w,h,buf:data.buffer,
    k:+els.colorCount.value,ign:els.transparent.checked,
    minSize:+els.minRegion.value,eps:Math.max(0.25,+els.simplify.value/8),
    outline:els.outputMode.value==='outlines',
    scale:+els.scaleInput.value||0.1,
    fx:els.flipX.checked,fy:els.flipY.checked,one:els.oneLine.checked
  },[data.buffer]);
}

els.uploadBtn.onclick=()=>els.fileInput.click();
els.fileInput.onchange=e=>loadFile(e.target.files[0]);
els.processBtn.onclick=processImage;
els.colorCount.oninput=()=>els.colorVal.textContent=els.colorCount.value;
els.simplify.oninput=()=>els.simplifyVal.textContent=(els.simplify.value/10).toFixed(1);
els.minRegion.oninput=()=>els.minRegionVal.textContent=els.minRegion.value;
els.copyBtn.onclick=async()=>{
  if(!resultText)return;
  try{await navigator.clipboard.writeText(resultText);}
  catch{els.outputCode.select();document.execCommand('copy');}
  const o=els.copyBtn.textContent;els.copyBtn.textContent='Copied';setTimeout(()=>els.copyBtn.textContent=o,1200);
};
els.downloadBtn.onclick=()=>{
  if(!resultText)return;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([resultText],{type:'text/plain;charset=utf-8'}));
  a.download=fileName;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{e.preventDefault();if(e.dataTransfer.files.length)loadFile(e.dataTransfer.files[0]);});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!els.processBtn.disabled)processImage();
});
</script>
</body>
</html>
